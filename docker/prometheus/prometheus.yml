global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: administrative-area-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api:5401"]   # actuator lives on its own, unpublished port
        labels:
          application: AdministrativeAreaApi

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
