# AdministrativeArea stack.
#
# Profiles keep the default bring-up to infrastructure ONLY, so you can restore a
# database dump without the API starting against it. Flyway now owns the schema
# (ddl-auto=validate), so the app refuses to start on drift rather than silently
# ALTERing a freshly restored database.
#
#   docker compose up -d                              postgres + redis
#   docker compose --profile app up -d                + api + ui
#   docker compose --profile observability up -d      + prometheus + grafana
#   docker compose --profile app --profile observability up -d       everything
#
# Restore a dump (custom format):
#   docker compose exec postgres pg_restore -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
#       --clean --if-exists --no-owner --no-privileges /backups/<your-dump>
# Restore a plain .sql:
#   docker compose exec -T postgres psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" < ./backups/<your-dump>.sql
#
# Credentials live in .env (gitignored). See .env.example.

name: administrative-area

x-restart: &restart
  restart: unless-stopped

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:

  # ---------------------------------------------------------------- infrastructure

  postgres:
    image: postgres:17-alpine
    container_name: aa-postgres
    <<: [*restart, *logging]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Speeds up restores and is safe for a dev box: fsync off trades crash-durability
      # for throughput. Remove for anything resembling production.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    ports:
      - "${POSTGRES_PORT:-5437}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Your dump files, readable from inside the container for pg_restore/psql.
      - ./backups:/backups:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -q"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [area-net]
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1g

  redis:
    image: redis/redis-stack:7.2.0-v11
    container_name: aa-redis
    <<: [*restart, *logging]
    environment:
      # AOF for durability + an LRU ceiling so the L2 cache can never OOM the container.
      # allkeys-lru is correct here: every key in this instance is a disposable cache entry.
      REDIS_ARGS: >-
        --appendonly yes
        --maxmemory ${REDIS_MAXMEMORY:-1gb}
        --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-8101}:6379"
      - "${REDIS_INSIGHT_PORT:-8001}:8001"   # RedisInsight UI
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [area-net]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1536m   # must exceed REDIS_MAXMEMORY (1gb) + AOF/RDB overhead

  # ---------------------------------------------------------------- application

  api:
    profiles: [app]
    build:
      context: .
      dockerfile: Dockerfile
    image: administrative-area-api:local
    container_name: aa-api
    <<: [*restart, *logging]
    environment:
      # Spring's SystemEnvironmentPropertySource maps DB_URL -> ${DB-URL}, etc.
      APP_PORT: 8084
      APP_PROFILE: ${APP_PROFILE:-dev1}
      DDL_AUTO: ${DDL_AUTO:-validate}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379

      # Actuator's own port. Note it is NOT in `ports:` below — health, metrics, env and heap details
      # are operational surface, not public API. Prometheus and the container healthcheck reach it
      # inside area-net; nothing outside the network can.
      MANAGEMENT_PORT: 9084

      # Browser origins allowed to call the API. Empty by default, and that is correct: the console is
      # served by nginx in the `ui` service, which reverse-proxies /api/ to this container, so it is
      # SAME-ORIGIN and CORS never applies to it.
      #
      # CORS is a browser mechanism — it does not restrict the services integrating with this API, which
      # send no Origin header and never consult these headers. Add an origin here only for a browser app
      # served from somewhere else, e.g. `ng serve` during development:
      #   CORS_ORIGINS=http://localhost:4200,https://console.internal.example.com
      CORS_ORIGINS: ${CORS_ORIGINS:-}

      # Serves BOTH /swagger-ui.html and /v3/api-docs. Set false to withdraw the API's documentation
      # entirely; hiding the console's link (DOCS_URL below) does not, on its own, do that.
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-true}

      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_CAPACITY: ${RATE_LIMIT_CAPACITY:-300}
      # True only because nginx sits in front and overwrites X-Forwarded-For. Exposed directly to
      # callers, that header is client-supplied and any caller could rotate it to evade the limit.
      RATE_LIMIT_TRUST_FORWARDED_FOR: ${RATE_LIMIT_TRUST_FORWARDED_FOR:-true}

      JAVA_OPTS: >-
        -XX:MaxRAMPercentage=75
        -XX:+UseZGC
        -XX:+ExitOnOutOfMemoryError
    ports:
      - "${API_PORT:-8084}:8084"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9084/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks: [area-net]
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1g

  ui:
    profiles: [app]
    build:
      context: ../AdministrativeArea-Frontend
      dockerfile: Dockerfile
    image: administrative-area-ui:local
    container_name: aa-ui
    <<: [*restart, *logging]
    environment:
      # A compiled Angular bundle has no environment variables, so these are written into config.js by
      # the container's entrypoint on start (docker/20-app-config.sh in the frontend). One image, every
      # environment — nothing here requires a rebuild.

      # Origin of the API as the BROWSER must reach it. Empty is correct and is the default: nginx in
      # this container reverse-proxies /api/ to the API, so the console is same-origin and needs no CORS
      # grant. Set this only if the API is served from a different host, and then add this console's
      # origin to CORS_ORIGINS above.
      API_URL: ${UI_API_URL:-}

      # Target of the header's "API Docs" link. Defaults to the same-origin Swagger UI, proxied by
      # nginx. Note the `-` rather than `:-`: setting UI_DOCS_URL= in .env passes an empty value
      # through, which removes the link. Pair that with API_DOCS_ENABLED=false to actually withdraw
      # the docs rather than merely unlink them.
      DOCS_URL: ${UI_DOCS_URL-/swagger-ui.html}
    ports:
      - "${UI_PORT:-4200}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost: inside the container `localhost` resolves to ::1 first and nginx's
      # `listen 80` binds IPv4 only, so this check was refused while the console served fine.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [area-net]

  # ---------------------------------------------------------------- observability

  prometheus:
    profiles: [observability]
    image: prom/prometheus:v2.54.1
    container_name: aa-prometheus
    <<: [*restart, *logging]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus
    networks: [area-net]

  grafana:
    profiles: [observability]
    image: grafana/grafana:11.2.0
    container_name: aa-grafana
    <<: [*restart, *logging]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus
    networks: [area-net]

volumes:
  pgdata:
  redisdata:
  prometheusdata:
  grafanadata:

networks:
  area-net:
    driver: bridge
