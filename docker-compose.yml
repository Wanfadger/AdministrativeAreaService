version: "3.1"

services:

  db:
    image: postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: qwertyuftdytrsdev
      POSTGRES_USER: siip-db-user-dev
      POSTGRES_DB: areadevdb
    ports:
      - "5437:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data

  redis:
    image: redis/redis-stack:latest
    restart: always
    ports:
      - "8101:6379"      # Redis port
      - "8001:8001"      # Redis Insight port
    volumes:
      - redis-data:/data
    environment:
      - REDIS_ARGS=--appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    image: administrativearea-api:latest
    ports:
      - "8084:8084"
    environment:
      DB-URL: jdbc:postgresql://db:5432/areadevdb?reWriteBatchedInserts=true
      DB-USERNAME: siip-db-user-dev
      DB-PASSWORD: qwertyuftdytrsdev
      ACTIVE-PROFILE: dev1
      REDIS-HOST: redis
      REDIS-PORT: 6379
      APP-PORT: 8084
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_healthy
    restart: always

  # ui:
  #   image: wanfadger/siip-ui:v0.0.1
  #   ports:
  #     - "4200:4200"

volumes:
  pg-data:
  redis-data:
  redis-insight-data: