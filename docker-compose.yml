version: "3.1"

services:

  db:
    image: postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: qwertyuftdytrs
      POSTGRES_USER: siip-db-user
      POSTGRES_DB: siipdb
    ports:
      - "5437:5432"

  redis:
    image: redis/redis-stack:latest
    restart: always
    ports:
      - "8101:6379"      # Redis port
      - "8001:8001"      # Redis Insight port
    # volumes:
    #   - redis-data:/data
    environment:
      - REDIS_ARGS=--appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

