# Hermetic test profile: in-memory H2 (PostgreSQL mode), no Flyway, no Redis.
spring.datasource.url=jdbc:h2:mem:aatest;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Flyway off — schema comes from Hibernate create-drop in tests
spring.flyway.enabled=false

# No Redis in tests — cache managers are provided by TestCacheConfig (in-memory)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# Don't seed bulk test data during tests
app.seed.test-data=false
app.seed.clear-existing=false
