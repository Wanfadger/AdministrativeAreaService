# Hermetic test profile: in-memory H2 (PostgreSQL mode), no Flyway, no Redis.
spring.datasource.url=jdbc:h2:mem:aatest;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# MUST match production. With OSIV left on (the Spring default), the session stays open through
# view rendering and a LazyInitializationException that production would throw is silently masked
# in tests — precisely the bug that lazy-loading changes introduce.
spring.jpa.open-in-view=false

# Flyway off — schema comes from Hibernate create-drop in tests
spring.flyway.enabled=false

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# No Redis in tests, so the cache runs L1-only — but it is the SAME TwoLevelCache/TwoLevelCacheManager
# that production runs, with the L2 tier absent (a supported topology, not a test-only stand-in). The
# old TestCacheConfig substituted a ConcurrentMapCacheManager here, which meant every cache test was
# exercising an implementation that ships to nobody.

# Short TTL so an eviction test never races the clock.
app.cache.l1-ttl=30s

# Warmup off by default: it would query the database on every context start, slowing the whole suite
# for no benefit. CacheWarmupTest turns it back on for itself.
app.cache.warmup.enabled=false
