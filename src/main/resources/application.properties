# Base configuration — intentionally minimal.
#
# Only the server port and the active-profile selector live here. ALL application configuration
# (datasource, JPA, Redis, Hikari, actuator, Swagger, seeding, …) lives in the active profile file,
# e.g. application-dev1.properties. The active profile MUST be set here because a profile-specific
# file cannot activate itself.

server.port=${APP-PORT:8084}
spring.profiles.active=${APP-PROFILE:dev1}
