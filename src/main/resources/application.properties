# Base configuration — intentionally minimal.
#
# Only the application identity, server port and active-profile selector live here. ALL other
# configuration (datasource, JPA, Redis, Hikari, actuator, Swagger, seeding, …) lives in the active
# profile file, e.g. application-dev1.properties. The active profile MUST be set here because a
# profile-specific file cannot activate itself.

# Tags every metric and log line with the service name — needed to tell services apart in
# Prometheus/Grafana once this is scraped alongside the other URRMS services.
spring.application.name=AdministrativeAreaApi

server.port=${APP-PORT:4401}
spring.profiles.active=${APP-PROFILE:dev1}

# Finish in-flight requests instead of killing them on SIGTERM (rolling deploys, `docker stop`).
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
