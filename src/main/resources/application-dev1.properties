# ---------------------------------------------------------------------------------------------
# Datasource
# ---------------------------------------------------------------------------------------------
spring.datasource.url=${DB-URL:jdbc:postgresql://localhost:5437/areadevdb}
spring.datasource.username=${DB-USERNAME:siip-db-user-dev}
spring.datasource.password=${DB-PASSWORD:qwertyuftdytrsdev}

# ---------------------------------------------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------------------------------------------
# No explicit hibernate.dialect: Hibernate 6 resolves it from JDBC metadata. Pinning it by hand
# only creates a way for it to be wrong.
#
# Flyway owns the schema. 'validate' means Hibernate checks the mapping against the real database
# and REFUSES TO START on drift, instead of silently ALTERing it — which is what 'update' did, and
# why the schema and the migrations had diverged in the first place.
spring.jpa.hibernate.ddl-auto=${DDL-AUTO:validate}

# SQL logging OFF for high traffic — formatting every statement is a major throughput killer.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Disable Open-Session-In-View: DTO mapping already runs inside the @Transactional service method,
# so OSIV only holds a DB connection open through view rendering — wasteful under load.
spring.jpa.open-in-view=false

# Bulk-insert tuning (the POST endpoint takes a list).
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Java 21 virtual threads — one per request, so request concurrency isn't bounded by a thread pool.
# NOTE: this makes the Hikari pool (below) the real concurrency limiter, not the web thread pool.
spring.threads.virtual.enabled=true

# ---------------------------------------------------------------------------------------------
# Flyway
# ---------------------------------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Stamps a pre-existing (restored) database at V1 and skips it, then applies V2+ . A fresh database
# is empty, so nothing is baselined and V1 runs normally. Both paths were tested against a copy of
# the real data before this shipped.
spring.flyway.baseline-on-migrate=true
# Checksums are now enforced: an edited migration fails the build rather than silently diverging.
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

# ---------------------------------------------------------------------------------------------
# HikariCP
# ---------------------------------------------------------------------------------------------
# Pool size is the real DB concurrency limiter (virtual threads handle request concurrency, not the
# pool). Keep it modest: a big pool adds contention, not throughput. Budget so that
# (instances x maximum-pool-size) stays within Postgres max_connections (~100 by default).
spring.datasource.hikari.pool-name=SIIP-AREA-POOL
spring.datasource.hikari.maximum-pool-size=${DB-POOL-MAX:20}
spring.datasource.hikari.minimum-idle=${DB-POOL-MIN-IDLE:5}
spring.datasource.hikari.max-lifetime=1800000
# 3s, not the 20s it was. Virtual threads removed the web thread pool, and with it the backpressure
# that used to stop 5,000 concurrent requests from all reaching the connection pool at once. They now
# all queue on 20 connections — and at a 20s timeout each, that is 20 seconds of held request state
# before anyone is told anything, which is how a slow database becomes an unresponsive service. Fail
# fast instead: the real backpressure now is the cache's per-key single-flight, which collapses N
# concurrent requests for the same key into one query.
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.register-mbeans=true
# PostgreSQL: rewrite batched inserts into a single multi-row statement.
spring.datasource.hikari.data-source-properties.reWriteBatchedInserts=true

# ---------------------------------------------------------------------------------------------
# Two-tier cache: Caffeine (L1, in-heap, per-pod) in front of Redis (L2, shared)
# ---------------------------------------------------------------------------------------------
# L1 TTL is deliberately short. Cross-pod invalidation rides Redis pub/sub, which is fire-and-forget:
# a pod that is mid-GC-pause when the message goes out never sees it and keeps serving its stale
# in-heap copy, and nothing detects that. This TTL bounds how long it can be wrong. It is the honest
# weak point of the design, and the reason this is 5m and not 30m to match L2 (which is shared and is
# evicted synchronously by the writer, so it has no such failure mode).
app.cache.l1-ttl=5m
app.cache.item-ttl=1h
app.cache.search-ttl=30m

# L1 bounds. Item regions hold one DTO per entry, so entries are the honest unit. Search regions hold
# a whole PAGE per entry — one aa_search_PARISH entry at size=2000 is ~12,000 objects — so they are
# bounded by row-weight instead. See AreaCacheProperties for the sizing.
app.cache.item-max-size=5000
app.cache.search-max-weight=20000

# Per-key load locks: N concurrent requests for the same expired key issue ONE query, not N.
app.cache.lock-stripes=512

# Set false to run L1-only (a legitimate single-instance topology).
app.cache.l2-enabled=true

# Warmup runs before the readiness probe flips, so a pod is warm before the load balancer sends it
# anything. Matters most during a rolling deploy, which is exactly when every pod is cold at once and
# the warm ones are being killed.
#
# These sizes MUST match what clients actually send. A cache key is derived from the query params, so
# warming size=50 when the map asks for size=2000 produces a different key: the warmed entry is never
# read, every real request still misses, and the startup log happily reports success. That is the one
# way this feature fails, and it fails invisibly.
app.cache.warmup.enabled=true
app.cache.warmup.map-size=2000
app.cache.warmup.tree-size=1000
app.cache.warmup.table-size=25
# The six 2,000-row map pulls are most of the warmup's cost and most of its value.
app.cache.warmup.include-map-pulls=true

spring.cache.type=redis
spring.data.redis.database=${REDIS-DATABASE:0}
spring.data.redis.host=${REDIS-HOST:localhost}
spring.data.redis.port=${REDIS-PORT:8101}
spring.data.redis.client-name=administrative-area-api

# FAIL FAST. The cache is an optimisation; the database is the source of truth. If Redis is slow or
# gone, the correct behaviour is to give up on it immediately and read through to Postgres.
#
# The default command timeout is 60 SECONDS. Measured against a stopped Redis, one /search took 120s
# and then returned 200 — the read path touches L2 twice (a get, then a put of the loaded value), so
# it ate two full timeouts. It "worked", which is precisely what makes it dangerous: under load every
# request holds its state for two minutes and the service is effectively down while reporting healthy.
#
# See CacheConfig.lettuceFailFast() for the other half — REJECT_COMMANDS, which stops Lettuce queueing
# commands while disconnected (queueing is what turns a 250ms timeout back into a 60s one).
#
# The two timeouts are NOT the same number, and conflating them broke startup.
#
# timeout = how long a COMMAND may take. 250ms: a cache read that is slower than the database it is
# meant to be shielding has no reason to exist, so give up and read through.
spring.data.redis.timeout=250ms
#
# connect-timeout = how long ESTABLISHING a connection may take: TCP handshake, and the pub/sub
# listener's initial SUBSCRIBE. That is legitimately slower than a GET against an already-open
# connection, and 250ms is not a generous budget for it on a loaded host. Setting both to 250ms made
# startup fail intermittently with "Connection initialization timed out after 250 millisecond(s)".
spring.data.redis.connect-timeout=2s

# Pool OFF, and commons-pool2 has been dropped from the pom so it cannot come back by accident.
# Lettuce is thread-safe and multiplexes every command over a single connection: a pool adds lock
# contention and no throughput. Pools are for blocking commands; a cache issues none.
spring.data.redis.lettuce.pool.enabled=false

# ---------------------------------------------------------------------------------------------
# CORS — browser origins only
# ---------------------------------------------------------------------------------------------
# CORS is enforced by the BROWSER. Integrating services (another Spring app, a Python job, curl) never
# consult these headers, so this list does not restrict them in any way. It restricts web front ends.
#
# The controller used to carry a bare @CrossOrigin, i.e. allow-all: any page on the internet could
# drive this API — writes included — from a visitor's browser and network position.
#
# The containerised console is NOT in this list and does not need to be: nginx serves it and proxies
# /api/ to the API, so it is same-origin and CORS never applies. Only `ng serve` is cross-origin.
app.cors.allowed-origins=${CORS-ORIGINS:http://localhost:4200}
# ETag must be exposed or the browser hides it from JS, no If-None-Match is ever sent back, and every
# conditional request silently degrades into a full response.
app.cors.exposed-headers=ETag

# ---------------------------------------------------------------------------------------------
# Rate limiting (per client, per pod)
# ---------------------------------------------------------------------------------------------
# Virtual threads removed the web thread pool, and with it the backpressure that used to stop N
# concurrent requests from all reaching the 20-connection pool at once. The cache's single-flight
# absorbs a stampede on the SAME key; this absorbs a flood across different ones.
app.rate-limit.enabled=true
app.rate-limit.capacity=300
app.rate-limit.refill-period=1m
# Bounded on purpose: a map keyed by IP is itself a memory-exhaustion vector, so the defence would
# become the vulnerability.
app.rate-limit.max-tracked-clients=100000
app.rate-limit.client-ttl=10m
# ONLY true behind a proxy we control (compose's nginx sets it). Exposed directly, X-Forwarded-For is
# client-supplied and any caller could rotate it per request to evade the limit entirely.
app.rate-limit.trust-forwarded-for=true

# ---------------------------------------------------------------------------------------------
# Actuator / metrics
# ---------------------------------------------------------------------------------------------
# Actuator moves to its own port, which is NOT published to the host in docker-compose. Health, env,
# metrics and heap details are operational surface, not public API — they should be reachable by
# Prometheus and the container healthcheck (both inside the network) and by nobody else.
management.server.port=${MANAGEMENT-PORT:9084}
# 'caches' exposes the cache regions and allows manual eviction — the only browser-visible window
# into the in-JVM (Caffeine) tier, which no Redis GUI can see.
management.endpoints.web.exposure.include=health,info,metrics,prometheus,caches
# 'when-authorized' with no security configured means details are NEVER shown. Dev wants them.
management.endpoint.health.show-details=always
# Adds /actuator/health/{liveness,readiness} — used by the container HEALTHCHECK and by k8s.
management.endpoint.health.probes.enabled=true

# Boot 3 property. The old 'management.metrics.export.prometheus.enabled' is deprecated at ERROR
# level and was silently doing nothing.
management.prometheus.metrics.export.enabled=true

management.metrics.distribution.percentiles-histogram.http.server.requests=true
# 'slo' is the Boot 3 name; the old 'sla' key does not exist and was ignored.
management.metrics.distribution.slo.http.server.requests=50ms,100ms,200ms,500ms,1s,2s

management.metrics.tags.application=AdministrativeAreaApi
management.metrics.tags.environment=dev1

# REMOVED (verified against Boot 3.2.3 spring-configuration-metadata.json — none of these are real
# properties; they were silently ignored, so the metrics they claimed to enable were never
# controlled by them):
#   management.metrics.cache.enabled
#   management.metrics.jvm.enabled
#   management.metrics.hikari.enabled
# JVM and Hikari metrics are auto-configured. Cache metrics require the cache to be registered with
# Micrometer at startup — handled in CacheConfig, not by a property.

# ---------------------------------------------------------------------------------------------
# HTTP response compression
# ---------------------------------------------------------------------------------------------
# The nested-ancestry payload repeats each ancestor across every row, which gzips extremely well
# (~20:1). Boot's default mime list omits application/problem+json, so errors would go uncompressed.
server.compression.enabled=true
server.compression.mime-types=application/json,application/problem+json,text/plain,text/css,text/html,application/javascript
server.compression.min-response-size=2048

# ---------------------------------------------------------------------------------------------
# Swagger / OpenAPI
# ---------------------------------------------------------------------------------------------
# One switch for both, because disabling the UI while still serving /v3/api-docs publishes the API's
# entire shape to anyone who asks — it hides the front door and leaves the blueprints on the step.
# The console's DOCS_URL hides the *link*; this is what actually withdraws the documents.
springdoc.api-docs.enabled=${API-DOCS-ENABLED:true}
springdoc.swagger-ui.enabled=${API-DOCS-ENABLED:true}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.urls-primary-name=0-AdministrativeArea-API
springdoc.show-actuator=true

# ---------------------------------------------------------------------------------------------
# App
# ---------------------------------------------------------------------------------------------
logging.level.org.springframework.cache=INFO
logging.level.org.springframework.data.redis.cache=INFO
