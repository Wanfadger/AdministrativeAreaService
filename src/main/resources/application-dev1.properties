# ---------------------------------------------------------------------------------------------
# Datasource
# ---------------------------------------------------------------------------------------------
spring.datasource.url=${DB-URL:jdbc:postgresql://localhost:5437/areadevdb}
spring.datasource.username=${DB-USERNAME:siip-db-user-dev}
spring.datasource.password=${DB-PASSWORD:qwertyuftdytrsdev}

# ---------------------------------------------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------------------------------------------
# No explicit hibernate.dialect: Hibernate 6 resolves it from JDBC metadata. Pinning it by hand
# only creates a way for it to be wrong.
#
# Flyway owns the schema. 'validate' means Hibernate checks the mapping against the real database
# and REFUSES TO START on drift, instead of silently ALTERing it — which is what 'update' did, and
# why the schema and the migrations had diverged in the first place.
spring.jpa.hibernate.ddl-auto=${DDL-AUTO:validate}

# SQL logging OFF for high traffic — formatting every statement is a major throughput killer.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Disable Open-Session-In-View: DTO mapping already runs inside the @Transactional service method,
# so OSIV only holds a DB connection open through view rendering — wasteful under load.
spring.jpa.open-in-view=false

# Bulk-insert tuning (the POST endpoint takes a list).
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Java 21 virtual threads — one per request, so request concurrency isn't bounded by a thread pool.
# NOTE: this makes the Hikari pool (below) the real concurrency limiter, not the web thread pool.
spring.threads.virtual.enabled=true

# ---------------------------------------------------------------------------------------------
# Flyway
# ---------------------------------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Stamps a pre-existing (restored) database at V1 and skips it, then applies V2+ . A fresh database
# is empty, so nothing is baselined and V1 runs normally. Both paths were tested against a copy of
# the real data before this shipped.
spring.flyway.baseline-on-migrate=true
# Checksums are now enforced: an edited migration fails the build rather than silently diverging.
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

# ---------------------------------------------------------------------------------------------
# HikariCP
# ---------------------------------------------------------------------------------------------
# Pool size is the real DB concurrency limiter (virtual threads handle request concurrency, not the
# pool). Keep it modest: a big pool adds contention, not throughput. Budget so that
# (instances x maximum-pool-size) stays within Postgres max_connections (~100 by default).
spring.datasource.hikari.pool-name=SIIP-AREA-POOL
spring.datasource.hikari.maximum-pool-size=${DB-POOL-MAX:20}
spring.datasource.hikari.minimum-idle=${DB-POOL-MIN-IDLE:5}
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.register-mbeans=true
# PostgreSQL: rewrite batched inserts into a single multi-row statement.
spring.datasource.hikari.data-source-properties.reWriteBatchedInserts=true

# ---------------------------------------------------------------------------------------------
# Redis (cache L2)
# ---------------------------------------------------------------------------------------------
spring.cache.type=redis
spring.data.redis.database=${REDIS-DATABASE:0}
spring.data.redis.host=${REDIS-HOST:localhost}
spring.data.redis.port=${REDIS-PORT:8101}
spring.data.redis.client-name=administrative-area-api

# Lettuce pool settings. These are honoured only because commons-pool2 is on the classpath.
spring.data.redis.lettuce.pool.max-active=200
spring.data.redis.lettuce.pool.max-idle=50
spring.data.redis.lettuce.pool.min-idle=10
spring.data.redis.lettuce.pool.max-wait=5000ms

# ---------------------------------------------------------------------------------------------
# Actuator / metrics
# ---------------------------------------------------------------------------------------------
# 'caches' exposes the cache regions and allows manual eviction — the only browser-visible window
# into the in-JVM (Caffeine) tier, which no Redis GUI can see.
management.endpoints.web.exposure.include=health,info,metrics,prometheus,caches
# 'when-authorized' with no security configured means details are NEVER shown. Dev wants them.
management.endpoint.health.show-details=always
# Adds /actuator/health/{liveness,readiness} — used by the container HEALTHCHECK and by k8s.
management.endpoint.health.probes.enabled=true

# Boot 3 property. The old 'management.metrics.export.prometheus.enabled' is deprecated at ERROR
# level and was silently doing nothing.
management.prometheus.metrics.export.enabled=true

management.metrics.distribution.percentiles-histogram.http.server.requests=true
# 'slo' is the Boot 3 name; the old 'sla' key does not exist and was ignored.
management.metrics.distribution.slo.http.server.requests=50ms,100ms,200ms,500ms,1s,2s

management.metrics.tags.application=AdministrativeAreaApi
management.metrics.tags.environment=dev1

# REMOVED (verified against Boot 3.2.3 spring-configuration-metadata.json — none of these are real
# properties; they were silently ignored, so the metrics they claimed to enable were never
# controlled by them):
#   management.metrics.cache.enabled
#   management.metrics.jvm.enabled
#   management.metrics.hikari.enabled
# JVM and Hikari metrics are auto-configured. Cache metrics require the cache to be registered with
# Micrometer at startup — handled in CacheConfig, not by a property.

# ---------------------------------------------------------------------------------------------
# HTTP response compression
# ---------------------------------------------------------------------------------------------
# The nested-ancestry payload repeats each ancestor across every row, which gzips extremely well
# (~20:1). Boot's default mime list omits application/problem+json, so errors would go uncompressed.
server.compression.enabled=true
server.compression.mime-types=application/json,application/problem+json,text/plain,text/css,text/html,application/javascript
server.compression.min-response-size=2048

# ---------------------------------------------------------------------------------------------
# Swagger / OpenAPI
# ---------------------------------------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.urls-primary-name=0-AdministrativeArea-API
springdoc.show-actuator=true

# ---------------------------------------------------------------------------------------------
# App
# ---------------------------------------------------------------------------------------------
logging.level.org.springframework.cache=INFO
logging.level.org.springframework.data.redis.cache=INFO
