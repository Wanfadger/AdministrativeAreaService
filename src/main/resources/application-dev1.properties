
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect
# SQL logging OFF for high traffic — printing/formatting every statement is a major throughput
# killer. Flip to true only for local debugging.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.hibernate.ddl-auto=${DDL-AUTO:update}
spring.datasource.url=${DB-URL:jdbc:postgresql://localhost:5437/areadevdb}
spring.datasource.username=${DB-USERNAME:siip-db-user-dev}
spring.datasource.password=${DB-PASSWORD:qwertyuftdytrsdev}


#spring.datasource.url=${DB-URL:jdbc:postgresql://167.172.2.37:5439/areadb_prod}
#spring.datasource.username=${DB-USERNAME:siip-db-user}
#spring.datasource.password=${DB-PASSWORD:qwertyuftdytrs}

spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.data.jpa.repositories.enabled=true

# Java 21 virtual threads — one per request, so high concurrency isn't bounded by a thread pool.
spring.threads.virtual.enabled=true
# Disable Open-Session-In-View: DTO mapping already runs inside the @Transactional service method,
# so OSIV only holds a DB connection through view rendering — wasteful under load.
spring.jpa.open-in-view=false

# Flyway Database Migration
# Note: Migration is conditional - will only create indexes if tables exist
# If tables don't exist yet, migration will skip gracefully
# After Hibernate creates tables, restart app or manually run migration to create indexes
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false
spring.flyway.clean-disabled=true

# HikariCP Connection Pool
# Pool size is the real DB concurrency limiter (virtual threads handle request concurrency, not the
# pool). Keep it modest: a big pool adds contention, not throughput. Budget so that
# (instances x maximum-pool-size) stays within Postgres max_connections (~100 by default).
# When scaling to many instances, front Postgres with PgBouncer and keep these pools small.
spring.datasource.hikari.pool-name=SIIP-AREA-POOL
spring.datasource.hikari.maximum-pool-size=${DB-POOL-MAX:20}
spring.datasource.hikari.minimum-idle=${DB-POOL-MIN-IDLE:5}
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.register-mbeans=true
# PostgreSQL: rewrite batched inserts into a single multi-row statement
spring.datasource.hikari.data-source-properties.reWriteBatchedInserts=true

# Hibernate Batch Processing - Optimized for Bulk Operations
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

## redis
spring.cache.type=redis
spring.data.redis.database=${REDIS-DATABASE:0}
spring.data.redis.host=${REDIS-HOST:localhost}
spring.data.redis.port=${REDIS-PORT:8101}
spring.cache.redis.cache-null-values=${REDIS-CACHE-NULL:false}

# Redis Connection Pool Configuration (Lettuce — Spring's default client)
spring.data.redis.lettuce.pool.max-active=200
spring.data.redis.lettuce.pool.max-idle=50
spring.data.redis.lettuce.pool.min-idle=10
spring.data.redis.lettuce.pool.max-wait=5000ms

# Spring Boot Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.metrics.export.prometheus.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.sla.http.server.requests=100ms,500ms,1s,2s
management.metrics.tags.application=AdministrativeAreaApi
management.metrics.tags.environment=dev1

# Cache Metrics
management.metrics.cache.enabled=true

# JVM Metrics
management.metrics.jvm.enabled=true

# Database Connection Pool Metrics
management.metrics.hikari.enabled=true

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
# Show the business API group first by default, and list actuator endpoints in the Monitoring group
springdoc.swagger-ui.urls-primary-name=0-AdministrativeArea-API
springdoc.show-actuator=true

# Test Data Seeding Configuration
# Set to true to automatically seed test data on application startup.
# Override per environment with the APP-SEED-TEST-DATA env var.
# Seeds each level ONLY if its table is empty (no duplication, never mutates existing data).
app.seed.test-data=${APP-SEED-TEST-DATA:false}

# Cache Logging (INFO for production, DEBUG for development)
# Set to DEBUG for detailed cache operations during development
# Set to INFO or WARN for production to reduce log volume
logging.level.org.springframework.cache=INFO
logging.level.org.springframework.data.redis.cache=INFO




